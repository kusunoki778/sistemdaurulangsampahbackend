# Render Blueprint - Livora API Backend (Laravel 13, PHP 8.3)
# Repo: sistemdaurulangsampahbackend (root repo = isi folder backend)
# Database managed di Aiven for MySQL (free plan), SSL wajib.
services:
  - type: web
    name: livora-backend
    runtime: php@8.3
    plan: free
    buildCommand: "composer install --no-dev --prefer-dist --optimize-autoloader"
    # migrate --force jalan tiap deploy (idempotent) sebelum server start
    startCommand: "php artisan storage:link || true && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Livora
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # isi manual, jangan diganti setelah ada data
      - key: APP_URL
        value: https://livora-backend-txpl.onrender.com
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: id_ID
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # host Aiven
      - key: DB_PORT
        sync: false # port Aiven
      - key: DB_DATABASE
        sync: false # nama database Aiven
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /opt/render/project/src/database/certs/aiven-mysql-ca.pem
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: CORS_ALLOWED_ORIGINS
        sync: false # domain frontend, dipisah koma
      - key: TRUSTED_PROXIES
        value: "*"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        # Upload JSON service account sebagai Secret File bernama
        # fcm-service-account.json di dashboard Render.
        value: /etc/secrets/fcm-service-account.json
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Livora
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_CALLBACK_TOKEN
        sync: false
      - key: SANDBOX_PAYOUT
        sync: false # true hanya saat demo pencairan tanpa Xendit
